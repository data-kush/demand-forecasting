# Light and dark themes: switch any time from the ⋮ menu -> Settings -> Theme (the choice is remembered).
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "10px"
chartCategoricalColors = ["#3b82f6", "#f97316", "#14b8a6", "#8b5cf6", "#ef4444", "#22c55e", "#64748b"]

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
borderColor = "#e2e8f0"
linkColor = "#2563eb"

[theme.light.sidebar]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f7"
textColor = "#0f172a"
borderColor = "#e2e8f0"
primaryColor = "#2563eb"
linkColor = "#2563eb"
codeTextColor = "#0f172a"

[theme.dark]
primaryColor = "#3b82f6"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#151e33"
textColor = "#e2e8f0"
borderColor = "#1f2a44"
linkColor = "#60a5fa"
dataframeHeaderBackgroundColor = "#111a2e"

[theme.dark.sidebar]
backgroundColor = "#0d1528"
secondaryBackgroundColor = "#18223a"
textColor = "#e2e8f0"
borderColor = "#1f2a44"
primaryColor = "#3b82f6"
linkColor = "#60a5fa"
codeTextColor = "#e2e8f0"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
